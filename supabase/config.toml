# Partial Supabase CLI config; the CLI fills in defaults for everything not listed.

project_id = "kronokeep"

# Called by pg_cron, not by users: it checks the x-cron-secret header instead of a user JWT.
[functions.recompute-due]
verify_jwt = false

# Public: opened by whoever scans the QR code or follows a share link. It only reveals non-private fields,
# and share links are checked against a hashed, expiring token. generate-report keeps JWT verification on.
[functions.verify-report]
verify_jwt = false

# Branded sign-up confirmation email. It shows {{ .Token }}, which the app verifies (no link: the link's
# redirect would land on the Site URL with the session in the URL). Push it to the hosted project with
# supabase/scripts/push-email-templates.ps1.
[auth.email.template.confirmation]
subject = "Confirm your KronoKeep account"
content_path = "./supabase/templates/confirmation.html"

# Password reset: the app's forgot-password flow verifies the emailed {{ .Token }} (type "recovery"),
# so this template must show the code, not just a link. Mirror it in the dashboard like the one above.
[auth.email.template.recovery]
subject = "Your KronoKeep password reset code"
content_path = "./supabase/templates/recovery.html"
